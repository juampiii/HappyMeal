# Install as /etc/happymeal/compose.testing.yml, root-owned and not writable by deploy.
# Keep project happymeal to reuse its existing network and PostgreSQL volume.
services:
  postgres:
    image: postgres:18-alpine
    container_name: happymeal-postgres
    environment:
      POSTGRES_DB: happymeal
      POSTGRES_USER: happymeal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - happymeal-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U happymeal -d happymeal]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ghcr.io/juampiii/happymeal-migrate:${HAPPYMEAL_TAG:?Commit tag required}
    command: [--connection, "Host=postgres;Port=5432;Database=happymeal;Username=happymeal;Password=${POSTGRES_PASSWORD}"]
    restart: 'no'
  api:
    image: ghcr.io/juampiii/happymeal-api:${HAPPYMEAL_TAG:?Commit tag required}
    environment:
      ConnectionStrings__Happymeal: "Host=postgres;Port=5432;Database=happymeal;Username=happymeal;Password=${POSTGRES_PASSWORD}"
    ports:
      - '8091:8080'
    restart: unless-stopped
volumes:
  happymeal-postgres-data:
